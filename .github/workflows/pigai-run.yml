name: Pigai Run

on:
  workflow_dispatch:
  push:
    paths:
      - "essay.txt"
      - "pigai_agent/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/pigai-run.yml"

jobs:
  run-pigai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIGAI_ACCOUNT: ${{ secrets.PIGAI_ACCOUNT }}
      PIGAI_PASSWORD: ${{ secrets.PIGAI_PASSWORD }}
      PIGAI_ESSAY_ID: "3431395"
      HEADLESS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check credentials
        id: creds
        shell: bash
        run: |
          if [[ -n "$PIGAI_ACCOUNT" && -n "$PIGAI_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit and parse Pigai result
        if: steps.creds.outputs.ready == 'true'
        run: python main.py

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pigai-result
          path: artifacts/
          if-no-files-found: ignore
