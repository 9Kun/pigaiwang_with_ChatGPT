name: Pigai Run

on:
  workflow_dispatch:
  push:
    paths:
      - "essay.txt"
      - "pigai_agent/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/pigai-run.yml"

jobs:
  run-pigai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIGAI_ACCOUNT: ${{ secrets.PIGAI_ACCOUNT }}
      PIGAI_PASSWORD: ${{ secrets.PIGAI_PASSWORD }}
      PIGAI_ESSAY_ID: "3431395"
      HEADLESS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt requests

      - name: Inspect Pigai login javascript
        run: |
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          from selenium import webdriver
          from selenium.webdriver.common.by import By

          opts = webdriver.ChromeOptions()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          driver = webdriver.Chrome(options=opts)
          driver.get('https://www.pigai.org/')
          html = driver.page_source
          print('TITLE:', driver.title)
          print('PAGE_ULOGIN_CONTEXT:')
          pos = html.find('ulogin')
          print(html[max(0,pos-2500):pos+3500])
          print('\nSCRIPT_SOURCES:')
          srcs=[]
          for s in driver.find_elements(By.TAG_NAME, 'script'):
              src=s.get_attribute('src')
              if src:
                  srcs.append(src)
                  print(src)
              else:
                  txt=s.get_attribute('innerHTML') or ''
                  if any(k in txt for k in ['ulogin','password_encrypt','lg_from_w']):
                      print('INLINE_MATCH:', txt[:12000])
          driver.quit()

          print('\nEXTERNAL_SCRIPT_MATCHES:')
          for src in srcs:
              try:
                  r=requests.get(src,timeout=20)
                  text=r.text
                  if any(k in text for k in ['ulogin','password_encrypt','lg_from_w']):
                      print('\n###',src)
                      for key in ['ulogin','password_encrypt','lg_from_w']:
                          i=text.find(key)
                          if i>=0:
                              print(text[max(0,i-3000):i+6000])
              except Exception as e:
                  print('FETCH_FAIL',src,repr(e))
          PY
