name: Pigai Run

on:
  workflow_dispatch:
  push:
    paths:
      - "essay.txt"
      - "pigai_agent/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/pigai-run.yml"

jobs:
  run-pigai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIGAI_ACCOUNT: ${{ secrets.PIGAI_ACCOUNT }}
      PIGAI_PASSWORD: ${{ secrets.PIGAI_PASSWORD }}
      PIGAI_ESSAY_ID: "3431395"
      HEADLESS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show browser version
        run: google-chrome --version || chromium --version || true

      - name: Inspect current Pigai login form
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          opts = webdriver.ChromeOptions()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          driver = webdriver.Chrome(options=opts)
          driver.get('https://www.pigai.org/')
          print('TITLE:', driver.title)
          u = driver.find_element(By.ID, 'username')
          p = driver.find_element(By.ID, 'password')
          print('USERNAME_PARENT:', (u.find_element(By.XPATH, '..').get_attribute('outerHTML') or '')[:6000])
          print('PASSWORD_PARENT:', (p.find_element(By.XPATH, '..').get_attribute('outerHTML') or '')[:6000])
          try:
              form = p.find_element(By.XPATH, './ancestor::form[1]')
              print('FORM:', (form.get_attribute('outerHTML') or '')[:20000])
          except Exception as e:
              print('NO_FORM:', repr(e))
          driver.quit()
          PY

      - name: Check credentials
        id: creds
        shell: bash
        run: |
          if [[ -n "$PIGAI_ACCOUNT" && -n "$PIGAI_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit and parse Pigai result
        if: ${{ false }}
        run: python main.py

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pigai-result
          path: artifacts/
          if-no-files-found: ignore
